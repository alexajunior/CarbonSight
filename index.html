<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>CarbonSight - Track Your Carbon Footprint</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="shortcut icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="manifest" href="manifest.json"/>
  <script src="vendor/quagga.min.js"></script>
  <style>
    :root {
      --ink: #18332b;
      --muted: #60736c;
      --paper: #f5f7f1;
      --panel: #ffffff;
      --line: #dce6dc;
      --leaf: #28734f;
      --leaf-dark: #1d563c;
      --mint: #e3f0e5;
      --sun: #e9b949;
      --coral: #c85b45;
      --shadow: 0 18px 45px rgba(24, 51, 43, 0.09);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      background-color: var(--paper);
      background-image: linear-gradient(rgba(40, 115, 79, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(40, 115, 79, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    header {
      padding: 52px max(24px, calc((100vw - 1080px) / 2));
      color: #f8fbf4;
      text-align: left;
      background: var(--ink);
      border-bottom: 5px solid var(--sun);
    }
    header h1 { margin: 0 0 10px; font-size: clamp(2.2rem, 5vw, 4.4rem); line-height: 0.95; letter-spacing: -1px; }
    header p { max-width: 520px; margin: 0; color: #c9d8cb; font-size: 1.05rem; line-height: 1.6; }
    header p + p { margin-top: 8px; }
    header p strong { color: #f6d27b; }
    .container {
      width: min(100% - 40px, 1080px);
      margin: 24px auto 0;
      padding: 28px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .container:first-of-type { margin-top: 36px; }
    .container h2 { margin: 0 0 20px; font-size: 1.25rem; letter-spacing: 0.2px; }
    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 18px;
      padding: 13px 19px;
      color: #fff;
      font: inherit;
      font-weight: 700;
      background: var(--leaf);
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(40, 115, 79, 0.2);
      transition: background 160ms ease, transform 160ms ease;
    }
    button:hover { background: var(--leaf-dark); transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
    #scanner { width: 100%; height: min(54vw, 430px); min-height: 260px; position: relative; overflow: hidden; background: #10221d; border: 8px solid #10221d; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12); }
    #scanner::after { content: ''; position: absolute; inset: 18% 10%; border: 1px solid rgba(246, 210, 123, 0.7); border-radius: 5px; pointer-events: none; }
    #scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #result { min-height: 94px; margin-top: 18px; padding: 20px; color: var(--ink); background: var(--mint); border: 1px solid #bed7c2; border-radius: 9px; }
    #result h3 { margin: 0 0 12px; color: var(--leaf-dark); font-size: 1.1rem; }
    #result p { margin: 7px 0; line-height: 1.45; }
    #result .carbon-value { margin: 10px 0; color: var(--coral); font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 700; letter-spacing: -1px; text-align: center; }
    #result .carbon-label { color: var(--muted); font-size: 0.82rem; font-weight: 700; letter-spacing: 0.08em; text-align: center; text-transform: uppercase; }
    #leaderboard, #challenges { margin-top: 24px; }
    #leaderList { margin: 0; padding: 0; list-style: none; }
    #leaderList li { padding: 13px 15px; margin: 8px 0; background: #f7faf5; border: 1px solid var(--line); border-left: 4px solid var(--leaf); border-radius: 6px; }
    #challenges > div { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--line); }
    #challenges > div:last-child { border-bottom: 0; }
    #challenges button { flex: 0 0 auto; margin: 0; padding: 9px 12px; font-size: 0.85rem; box-shadow: none; }
    footer { padding: 34px 20px; color: var(--muted); text-align: center; font-size: 0.85rem; }
    footer p { margin: 5px 0; }
    @media (min-width: 860px) {
      main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.65fr); gap: 24px; width: min(100% - 40px, 1080px); margin: 36px auto 0; }
      .container, .container:first-of-type, #leaderboard, #challenges { width: auto; margin: 0; }
      .container:first-of-type { grid-row: span 2; }
    }
    @media (max-width: 520px) {
      header { padding: 38px 20px; }
      .container { width: min(100% - 24px, 1080px); padding: 20px; }
      #challenges > div { align-items: flex-start; flex-direction: column; gap: 10px; }
      #challenges button { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🌍 CarbonSight</h1>
    <p>Scan products to track their carbon footprint</p>
  </header>
  <main>
  <div class="container">
    <button onclick="startScanner()">📷 Start Scanner</button>
    <div id="scanner"></div>
    <div id="result"></div>
  </div>
  <div class="container" id="leaderboard">
    <h2>🏆 Leaderboard</h2>
    <ul id="leaderList"></ul>
  </div>
  <div class="container">
    <h2>🎯 Challenges</h2>
    <div id="challenges"></div>
  </div>
  </main>
    <footer>
      <p>© 2026 CarbonSight</p>
      <p>Created with concern by Braveon AI</p>
    </footer>
  <script>
    const challenges = [
      { id: 1, title: '♻️ Recycle 10 items', points: 50 },
      { id: 2, title: '🚴 Bike to work for a week', points: 100 },
      { id: 3, title: '🥗 Go vegan for a day', points: 75 }
    ];
    
    let isScanning = false;
    function startScanner() {
      const scannerEl = document.getElementById('scanner');
      const resultEl = document.getElementById('result');
      let candidateCode = '';
      let matchingReads = 0;

      isScanning = false;
      resultEl.innerHTML = '<p>Initializing scanner...</p>';

      if (typeof Quagga === 'undefined') {
        resultEl.innerHTML = '<p style="color:red;">Scanner files are missing. Run <code>npm install</code> and reload the app.</p>';
        return;
      }
      if (!window.isSecureContext) {
        resultEl.innerHTML = '<p style="color:red;">Phone camera access requires HTTPS. Open this app through a secure local address, then visit it once while online to enable offline use.</p>';
        return;
      }

      const handleDetection = result => {
        if (isScanning || !result.codeResult || !result.codeResult.code) return;

        const code = result.codeResult.code.replace(/\D/g, '');
        if (!isValidBarcode(code)) {
          candidateCode = '';
          matchingReads = 0;
          return;
        }

        if (code === candidateCode) {
          matchingReads += 1;
        } else {
          candidateCode = code;
          matchingReads = 1;
        }

        if (matchingReads < 3) return;

        isScanning = true;
        Quagga.stop();
        Quagga.offDetected(handleDetection);
        showScanResult(code, resultEl);
      };

      Quagga.onDetected(handleDetection);
      Quagga.init({
        inputStream: {
          name: 'Live',
          type: 'LiveStream',
          target: scannerEl,
          constraints: {
            width: 640,
            height: 480,
            facingMode: 'environment'
          }
        },
        decoder: {
          readers: ['ean_reader', 'ean_8_reader', 'upc_reader', 'upc_e_reader']
        }
      }, function(error) {
        if (error) {
          resultEl.innerHTML = '<p style="color:red;">Camera error: ' + error + '</p>';
          return;
        }
        Quagga.start();
        resultEl.innerHTML = '<p>📷 Scanner ready. Point camera at barcode.</p>';
      });

    }

    function isValidBarcode(code) {
      if (![8, 12, 13, 14].includes(code.length)) return false;

      let total = 0;
      for (let index = code.length - 1; index >= 0; index -= 1) {
        const digit = Number(code[index]);
        const positionFromRight = code.length - index;
        total += positionFromRight % 2 === 0 ? digit * 3 : digit;
      }
      return total % 10 === 0;
    }

    async function showScanResult(code, resultEl) {
        resultEl.innerHTML = `
          <h3>🔎 Looking up product</h3>
          <p><strong>Barcode:</strong> ${code}</p>
        `;

        try {
          const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json`);
          if (!response.ok) throw new Error('Product lookup failed');
          const data = await response.json();
          const product = data.product || {};
          const reportedFootprint = Number(
            product.ecoscore_data?.agribalyse?.co2_total ??
            product.ecoscore_data?.carbon_footprint?.value ??
            product.carbon_footprint_from_known_ingredients
          );
          const productName = product.product_name || 'Unknown product';
          const hasReportedFootprint = Number.isFinite(reportedFootprint) && reportedFootprint > 0;
          const footprint = hasReportedFootprint ? reportedFootprint : estimateFootprint(code, product);

          resultEl.innerHTML = `
            <h3>✅ Product Scanned</h3>
            <p><strong>Product:</strong> ${productName}</p>
            <p><strong>Barcode:</strong> ${code}</p>
            <div class="carbon-label">${hasReportedFootprint ? 'Carbon Footprint' : 'Estimated Carbon Footprint'}</div>
            <div class="carbon-value">${footprint.toFixed(2)} kg CO₂</div>
            <p style="text-align: center; color: #666; font-size: 0.9em;">Per product unit, ${hasReportedFootprint ? 'according to Open Food Facts' : 'based on the product category'}</p>
          `;
        } catch (error) {
          const footprint = estimateFootprint(code, {});
          resultEl.innerHTML = `
            <h3>✅ Barcode Scanned</h3>
            <p><strong>Barcode:</strong> ${code}</p>
            <div class="carbon-label">Estimated Carbon Footprint</div>
            <div class="carbon-value">${footprint.toFixed(2)} kg CO₂</div>
            <p style="text-align: center; color: #666; font-size: 0.9em;">Per product unit. Product details were unavailable, so this is a barcode-based estimate.</p>
          `;
          console.error(error);
        }
    }

    function estimateFootprint(code, product) {
      const categories = `${product.categories || ''} ${product.product_name || ''}`.toLowerCase();
      const categoryBase = categories.includes('beef') || categories.includes('cattle') ? 27 :
        categories.includes('cheese') || categories.includes('lamb') ? 12 :
        categories.includes('chocolate') || categories.includes('coffee') ? 8 :
        categories.includes('pork') || categories.includes('chicken') ? 6 :
        categories.includes('fish') || categories.includes('seafood') ? 5 :
        categories.includes('milk') || categories.includes('dairy') ? 3 : 2;
      const barcodeValue = [...code].reduce((total, digit) => total + Number(digit || 0), 0);
      return categoryBase + (barcodeValue % 10) / 10;
    }
    
    function loadLeaderboard() {
      const leaderListEl = document.getElementById('leaderList');
      if (!leaderListEl) {
        console.error('Leaderboard element not found');
        return;
      }
      
      let users = JSON.parse(localStorage.getItem('users') || '[]');
      users.sort((a, b) => b.points - a.points);
      
      if (users.length === 0) {
        leaderListEl.innerHTML = '<li style="text-align: center; border: none;">No entries yet. Complete challenges to earn points!</li>';
      } else {
        leaderListEl.innerHTML = users.map((u, idx) => {
          const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : '🏅';
          return `<li>${medal} ${idx + 1}. <strong>${u.name}</strong>: ${u.points} pts</li>`;
        }).join('');
      }
    }
    
    function showChallenges() {
      const challengesEl = document.getElementById('challenges');
      if (!challengesEl) {
        console.error('Challenges element not found');
        return;
      }
      
      challengesEl.innerHTML = challenges.map(c =>
        `<div><span>${c.title}</span><button onclick="completeChallenge(${c.id})">Complete (+${c.points} pts)</button></div>`
      ).join('');
    }
    
    function completeChallenge(id) {
      const c = challenges.find(x => x.id === id);
      if (!c) return;
      
      // Get or create user
      let users = JSON.parse(localStorage.getItem('users') || '[]');
      let currentUser = users.find(u => u.name === 'You');
      
      if (!currentUser) {
        currentUser = { name: 'You', points: 0 };
        users.push(currentUser);
      }
      
      // Award points
      currentUser.points += c.points;
      
      // Update users array
      users = users.map(u => u.name === 'You' ? currentUser : u);
      localStorage.setItem('users', JSON.stringify(users));
      
      alert(`🎉 Challenge completed! +${c.points} pts`);
      
      // Refresh leaderboard to show updated points
      loadLeaderboard();
    }
    
    // Initialize on page load
    document.addEventListener('DOMContentLoaded', () => {
      showChallenges();
      loadLeaderboard();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    });
  </script>
</body>
</html>
